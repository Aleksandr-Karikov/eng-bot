<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>WordBoss — настройки</title>
  <style>
    body { font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; color: #1f2328; }
    h1 { font-size: 20px; }
    label { display: block; margin: 16px 0 4px; font-weight: 600; }
    input { width: 100%; box-sizing: border-box; padding: 8px 10px; font: inherit; border: 1px solid #d0d7de; border-radius: 8px; }
    button { margin-top: 16px; padding: 8px 16px; font: inherit; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; }
    #status { margin-top: 12px; min-height: 1.5em; }
    .ok { color: #1a7f37; } .err { color: #cf222e; }
    small { color: #656d76; }
  </style>
</head>
<body>
  <h1>🧩 WordBoss</h1>
  <p>Ключ выдаёт бот: напиши ему <b>/extension</b> в личку.</p>
  <label for="key">Ключ</label>
  <input id="key" autocomplete="off" spellcheck="false">
  <label for="server">Адрес бота</label>
  <input id="server" placeholder="http://localhost:8787" spellcheck="false">
  <small>Пока бот принимает слова только на том компьютере, где он запущен.</small>
  <div><button id="save">Сохранить и проверить</button></div>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
